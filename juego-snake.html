<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Snake - BillUpps Games</title>
    <style>
        body { background: #0d1117; color: white; text-align: center; font-family: Arial; }
        canvas { background: #000; border: 3px solid #58a6ff; margin-top: 20px; }
        h1 { color: #58a6ff; }
       .boton { background: #238636; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🐍 Snake Game</h1>
    <p>Puntuación: <span id="score">0</span></p>
    <canvas id="game" width="400" height="400"></canvas>
    <p>Usá las flechas del teclado para moverte</p>
    <br>
    <a href="index.html" class="boton">← Volver al inicio</a>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const box = 20;
        let snake = [{x: 9, y: 10}];
        let food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
        let dir = 'RIGHT';
        let score = 0;

        document.addEventListener('keydown', e => {
            if(e.key === 'ArrowLeft' && dir!== 'RIGHT') dir = 'LEFT';
            if(e.key === 'ArrowUp' && dir!== 'DOWN') dir = 'UP';
            if(e.key === 'ArrowRight' && dir!== 'LEFT') dir = 'RIGHT';
            if(e.key === 'ArrowDown' && dir!== 'UP') dir = 'DOWN';
        });

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 400, 400);
            
            for(let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i === 0? '#58a6ff' : '#238636';
                ctx.fillRect(snake[i].x * box, snake[i].y * box, box, box);
            }
            
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x * box, food.y * box, box, box);
            
            let headX = snake[0].x;
            let headY = snake[0].y;
            
            if(dir === 'LEFT') headX--;
            if(dir === 'UP') headY--;
            if(dir === 'RIGHT') headX++;
            if(dir === 'DOWN') headY++;
            
            if(headX === food.x && headY === food.y) {
                score++;
                document.getElementById('score').innerText = score;
                food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
            } else {
                snake.pop();
            }
            
            let newHead = {x: headX, y: headY};
            
            if(headX < 0 || headY < 0 || headX >= 20 || headY >= 20 || collision(newHead, snake)) {
                alert('Game Over! Puntuación: ' + score);
                score = 0;
                snake = [{x: 9, y: 10}];
                document.getElementById('score').innerText = score;
            }
            
            snake.unshift(newHead);
        }
        
        function collision(head, array) {
            for(let i = 0; i < array.length; i++) {
                if(head.x === array[i].x && head.y === array[i].y) return true;
            }
            return false;
        }
        
        setInterval(draw, 100);
    </script>
</body>
</html>
