<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Películas - BillUpps Games</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--bg:#0d1117;--card:#0f1720;--muted:#9aa4b2;--accent:#58a6ff;--btn:#238636}
    body{background:var(--bg);color:#e6eef3;font-family:Inter,Arial,Helvetica,sans-serif;margin:0;padding:20px}
    .container{max-width:980px;margin:0 auto}
    h1{color:var(--accent);margin:8px 0}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:18px}
    .card{background:var(--card);padding:14px;border-radius:10px}
    .thumb{width:100%;border-radius:8px;display:block}
    .meta{color:var(--muted);font-size:0.9rem;margin-top:8px}
    .btn{background:var(--btn);color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:600;display:inline-block;margin-top:8px}
    a.volver{display:inline-block;margin-top:14px;color:var(--accent);text-decoration:none}
    .yt { margin-top:12px; border:0; width:100%; height:200px; border-radius:8px; }
    @media(min-width:900px){ .yt{height:260px} }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Películas y Series</h1>
    <p class="lead">Trailers, recomendaciones y fichas. Haz click en "Ver trailer" para abrir el video.</p>

    <div class="grid">
      <!-- Película ejemplo 1 -->
      <div class="card">
        <h3>Película Ejemplo</h3>
        <img class="thumb" src="example-wallpaper.svg" alt="Miniatura ejemplo">
        <p class="meta">Año: 2024 · Duración: 1h 45m</p>
        <!-- Reemplaza el href con el enlace a YouTube del trailer -->
        <a class="btn" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener">Ver trailer</a>
      </div>

      <!-- Película ejemplo 2 -->
      <div class="card">
        <h3>Documental Ejemplo</h3>
        <img class="thumb" src="example-wallpaper.svg" alt="Miniatura ejemplo">
        <p class="meta">Año: 2022 · Duración: 50m</p>
        <a class="btn" href="https://www.youtube.com/" target="_blank" rel="noopener">Ver trailer</a>
      </div>
    </div>

    <a class="volver" href="index.html">← Volver al inicio</a>
  </div>
</body>
</html>
